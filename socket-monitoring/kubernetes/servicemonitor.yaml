apiVersion: v1
kind: Service
metadata:
  name: kali-socket-inventory
  namespace: default
  labels:
    app.kubernetes.io/name: kali-socket-inventory
spec:
  ports:
    - name: metrics
      port: 19100
      targetPort: 19100
      protocol: TCP
  type: ClusterIP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: kali-socket-inventory
  namespace: default
subsets:
  - addresses:
      - ip: __KIND_NODE_IP__
    ports:
      - name: metrics
        port: 19100
        protocol: TCP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kali-socket-inventory
  namespace: default
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kali-socket-inventory
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
