apiVersion: v1
kind: Service
metadata:
  name: kali-netdata
  namespace: default
  labels:
    app.kubernetes.io/name: kali-netdata
spec:
  ports:
  - name: metrics
    port: 19999
    protocol: TCP
    targetPort: 19999
---
apiVersion: v1
kind: Endpoints
metadata:
  name: kali-netdata
  namespace: default
subsets:
- addresses:
  - ip: 172.22.0.1
  ports:
  - name: metrics
    port: 19999
    protocol: TCP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kali-netdata
  namespace: default
  labels:
    release: monitoring
    app.kubernetes.io/name: kali-netdata
spec:
  namespaceSelector:
    matchNames:
    - default
  selector:
    matchLabels:
      app.kubernetes.io/name: kali-netdata
  endpoints:
  - port: metrics
    path: /api/v1/allmetrics
    interval: 30s
    scrapeTimeout: 10s
    params:
      format:
      - prometheus
      help:
      - 'no'
      types:
      - 'no'
      filter:
      - system.* disk.* disk_space.* disk_inodes.* net.* sensors.*
    honorLabels: true
---
apiVersion: v1
kind: Service
metadata:
  name: kali-docker-metrics
  namespace: default
  labels:
    app.kubernetes.io/name: kali-docker-metrics
spec:
  ports:
  - name: metrics
    port: 19100
    protocol: TCP
    targetPort: 19100
---
apiVersion: v1
kind: Endpoints
metadata:
  name: kali-docker-metrics
  namespace: default
subsets:
- addresses:
  - ip: 172.22.0.1
  ports:
  - name: metrics
    port: 19100
    protocol: TCP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kali-docker-metrics
  namespace: default
  labels:
    release: monitoring
    app.kubernetes.io/name: kali-docker-metrics
spec:
  namespaceSelector:
    matchNames:
    - default
  selector:
    matchLabels:
      app.kubernetes.io/name: kali-docker-metrics
  endpoints:
  - port: metrics
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s
